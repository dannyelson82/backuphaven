name: Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*.*"]  # four-part versions (ADR-0012)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dannyelson82/backuphaven

jobs:
  image:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: backuphaven:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eu
          # A pretend Unraid: one app template on the flash drive, its data on a share.
          mkdir -p smoke/templates smoke/appdata/demo
          printf '%s\n' '<?xml version="1.0"?>' '<Container version="2">' \
            '  <Name>demo</Name><Repository>example/demo</Repository>' \
            '  <Config Name="Config" Target="/config" Default="/mnt/user/appdata/demo" Mode="rw" Type="Path">/mnt/user/appdata/demo</Config>' \
            '</Container>' > smoke/templates/my-demo.xml
          echo '{"setting": true}' > smoke/appdata/demo/settings.json
          sudo chown -R 99:100 smoke/appdata
          # Plugins only (ADR-0013): the demo app gets a local plugin.
          mkdir -p smoke/plugins
          printf '%s\n' 'id: demo' 'name: Demo' 'version: 1.0.0' 'kind: app' 'plugin_api: 1' \
            'author: CI' 'recognise: {images: ["example/demo"]}' \
            'backup: {folder: /config, include: ["**"], expect: ["settings.json"]}' \
            > smoke/plugins/demo.yaml
          docker run -d --name bh -p 7272:7272 \
            -v "$PWD/smoke/templates:/boot/config/plugins/dockerMan/templates-user:ro" \
            -v "$PWD/smoke/appdata:/mnt/user/appdata" \
            -v "$PWD/smoke/plugins:/config/plugins:ro" \
            backuphaven:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' bh)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker ps -a
          test "$(docker inspect -f '{{.State.Health.Status}}' bh)" = healthy
          curl -fsS http://127.0.0.1:7272/healthz
          curl -fsS http://127.0.0.1:7272/api/v1/version | grep -q '"name":"BackupHaven"'
          curl -fsS http://127.0.0.1:7272/api/v1/auth/state | grep -q '"setup_required":true'
          curl -fsS http://127.0.0.1:7272/ | grep -q '<title>BackupHaven</title>'
          # Create the admin, then check the bundled plugins made it into the image.
          jar="$(mktemp)"
          csrf="$(curl -fsS -c "$jar" http://127.0.0.1:7272/api/v1/auth/state | sed -n 's/.*"csrf_token":"\([^"]*\)".*/\1/p')"
          curl -fsS -b "$jar" -c "$jar" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"smoke test password"}' http://127.0.0.1:7272/api/v1/setup >/dev/null
          curl -fsS -b "$jar" http://127.0.0.1:7272/api/v1/plugins | tee plugins.json | head -c 300; echo
          for id in generic sonarr radarr prowlarr plex backuphaven; do grep -q "\"id\":\"$id\"" plugins.json; done
          # Nothing is backed up until an app is in the backup schedule (ADR-0011).
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "X-CSRF-Token: $csrf" \
            -X POST http://127.0.0.1:7272/api/v1/runs)" = 409
          curl -fsS -b "$jar" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' -X PUT \
            -d '{"apps":["demo"]}' http://127.0.0.1:7272/api/v1/schedule/apps
          # A real backup run: written, verified, owned by PUID:PGID, 0600.
          curl -fsS -b "$jar" -H "X-CSRF-Token: $csrf" -X POST http://127.0.0.1:7272/api/v1/runs
          for _ in $(seq 1 30); do
            curl -fsS -b "$jar" http://127.0.0.1:7272/api/v1/runs/1 > run.json
            grep -q '"status":"running"' run.json || break
            sleep 1
          done
          cat run.json; echo
          grep -q '"verified":true' run.json
          grep -q '"app":"demo","plugin":"demo","status":"ok","files":1' run.json
          docker exec bh sh -c 'stat -c "%u:%g %a %n" /backups/backuphaven-*.tar.zst*' | tee archive.txt
          test "$(grep -c '^99:100 600 ' archive.txt)" = 2
          # Root inside the container, but only the capabilities ADR-0006 allows:
          # chown, dac_override, fowner, fsetid, setgid, setuid = 0xdb; no new privileges.
          docker exec bh sh -c 'for p in /proc/[0-9]*; do
              if tr "\0" " " < "$p/cmdline" 2>/dev/null | grep -q "[b]in/backuphaven"; then
                grep -E "^(Uid|CapEff|CapBnd|NoNewPrivs)" "$p/status"; fi; done' | tee caps.txt
          grep -E '^Uid:\s+0\b' caps.txt
          grep -E '^CapEff:\s+00000000000000db$' caps.txt
          grep -E '^CapBnd:\s+00000000000000db$' caps.txt
          grep -E '^NoNewPrivs:\s+1$' caps.txt
          docker exec bh stat -c '%u:%g %n' /config /backups | tee owners.txt
          test "$(grep -c '^99:100 ' owners.txt)" = 2
          docker logs bh 2>&1 | tail -n 20
          docker rm -f bh

      - name: Vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backuphaven:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backuphaven:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+)$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
