[project]
name = "backuphaven"
version = "0.0.4.0"
description = "Simple, plugin-based, automated nightly backups for the apps on your Unraid server"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[project.scripts]
backuphaven = "backuphaven.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N", "ASYNC", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "F811"]  # S108: /tmp as example data; F811: fixtures imported from other test modules
"src/backuphaven/db/migrations/versions/**" = ["E501"]  # generated by Alembic

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["backuphaven", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
