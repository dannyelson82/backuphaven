id: generic
name: Any app
version: 1.0.0
kind: app
plugin_api: 1
author: BackupHaven
description: >-
  For apps without their own plugin. Backs up every data folder of the app,
  finds SQLite databases by themselves and checks them, and skips caches,
  logs and temporary files.
backup:
  mode: snapshot
  folder: "*"
  databases: auto
  include: ["**"]
  exclude:
    - "**/cache/**"
    - "**/Cache/**"
    - "**/caches/**"
    - "**/.cache/**"
    - "**/logs/**"
    - "**/Logs/**"
    - "**/log/**"
    - "**/*.log"
    - "**/*.log.[0-9]*"
    - "**/tmp/**"
    - "**/transcode/**"
    - "**/Transcode/**"
    - "**/*.pid"
    - "**/*.sock"
settings:
  - id: logs
    label: Include logs
    help: Log files can be large and are rarely needed to restore an app.
    default: false
    when_true:
      include: ["**/logs/**", "**/Logs/**", "**/log/**", "**/*.log"]
