id: sonarr
name: Sonarr
version: 1.0.0
kind: app
plugin_api: 1
author: BackupHaven
description: >-
  Sonarr's settings and database. Logs and downloaded posters are skipped; Sonarr's
  own backup copies are optional.
recognise:
  images: ["*/sonarr", "sonarr"]
backup:
  mode: snapshot
  folder: /config
  databases: ["sonarr.db"]
  include: ["**"]
  exclude:
    - "logs/**"
    - "logs.db"
    - "MediaCover/**"
    - "Backups/**"
    - "Sentry/**"
    - "*.pid"
    - "**/*.log"
  expect: ["config.xml", "sonarr.db"]
settings:
  - id: covers
    label: Include posters
    help: Posters and fan art. Sonarr downloads them again if they're missing.
    default: false
    when_true:
      include: ["MediaCover/**"]
  - id: own_backups
    label: Include Sonarr's own backups
    help: The zip files Sonarr makes itself in its Backups folder.
    default: false
    when_true:
      include: ["Backups/**"]
restore:
  stop_first: true
