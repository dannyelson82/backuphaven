plugin: plex
image: lscr.io/linuxserver/plex:latest
folders:
  - target: /config
    files:
      "Library/Application Support/Plex Media Server/Preferences.xml": "<Preferences MachineIdentifier=\"example\"/>"
      "Library/Application Support/Plex Media Server/Plug-in Support/Preferences/com.plexapp.agents.imdb.xml": "<p/>"
      "Library/Application Support/Plex Media Server/Cache/PhotoTranscoder/a.jpg": "cache"
      "Library/Application Support/Plex Media Server/Metadata/Movies/a/poster.jpg": "poster"
      "Library/Application Support/Plex Media Server/Logs/Plex Media Server.log": "log"
    sqlite:
      - "Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db"
      - "Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db"
must_restore:
  - "/config/Library/Application Support/Plex Media Server/Preferences.xml"
  - "/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db"
  - "/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db"
must_not_backup:
  - "/config/Library/Application Support/Plex Media Server/Cache/PhotoTranscoder/a.jpg"
  - "/config/Library/Application Support/Plex Media Server/Metadata/Movies/a/poster.jpg"
  - "/config/Library/Application Support/Plex Media Server/Logs/Plex Media Server.log"
